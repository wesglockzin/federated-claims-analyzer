[project]
name = "federated-claims-analyzer"
version = "7.3.8"
description = "Web tool that runs real OIDC and SAML sign-ins against Okta and ADFS and shows the claims."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "flask>=3.0,<4",
    "python-dotenv>=1.0,<2",
    "python3-saml>=1.16,<2",
    "requests>=2.31,<3",
    "python-jose[cryptography]>=3.3,<4",
    "Authlib>=1.3,<2",
    "gunicorn>=22,<24",
    "markdown>=3.5,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.6",
    "deptry>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "sso_tester_logic", "saml_settings", "guards", "http_session", "howto_page"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev"]
known_first_party = ["app", "sso_tester_logic", "saml_settings", "guards", "http_session", "howto_page"]

[tool.deptry.per_rule_ignores]
DEP002 = ["gunicorn"]  # run by the Dockerfile CMD, never imported
