name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries for python3-saml
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libxml2-dev libxmlsec1-dev libxmlsec1-openssl
      - name: Install
        run: pip install -e ".[dev]" pip-audit uv
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Unused or undeclared dependencies
        run: deptry .
      - name: Tests
        run: pytest -q
      - name: Lockfile is current
        run: uv lock --check
      - name: Dependency audit
        # python-jose (PYSEC-2026-4298) and its dependency ecdsa (PYSEC-2026-1325) have no
        # fixed release. The calls that verify signatures pin algorithms=["RS256"], so the
        # ecdsa-based algorithms are never used; the one call in app.py is unverified
        # decoding of an already obtained token, for display only.
        # Remove the ignores when fixed releases exist or python-jose is replaced.
        run: pip-audit . --ignore-vuln PYSEC-2026-4298 --ignore-vuln PYSEC-2026-1325

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t federated-claims-analyzer .
