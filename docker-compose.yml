# `docker compose up` reads settings from the shell or from a `.env` file
# (copy .env.example to .env and fill it in).
services:
  app:
    build: .
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: "${PORT:-8080}"
      AUTH_MODE: "${AUTH_MODE:-oidc}"
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY:?FLASK_SECRET_KEY is not set}"
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:8080}"
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OKTA_DEV_OIDC_SECRET: "${OKTA_DEV_OIDC_SECRET:?OKTA_DEV_OIDC_SECRET is not set}"
      OKTA_STG_OIDC_SECRET: "${OKTA_STG_OIDC_SECRET:-}"
      OKTA_PROD_OIDC_SECRET: "${OKTA_PROD_OIDC_SECRET:-}"
      OKTA_DEV_API_TOKEN: "${OKTA_DEV_API_TOKEN:-}"
      OKTA_PROD_API_TOKEN: "${OKTA_PROD_API_TOKEN:-}"
      ADFS_DEV_CLIENT_SECRET: "${ADFS_DEV_CLIENT_SECRET:?ADFS_DEV_CLIENT_SECRET is not set}"
      ADFS_PROD_CLIENT_SECRET: "${ADFS_PROD_CLIENT_SECRET:?ADFS_PROD_CLIENT_SECRET is not set}"
      SAML_TESTER_CERT: "${SAML_TESTER_CERT:-}"
      SAML_TESTER_KEY: "${SAML_TESTER_KEY:-}"
      FORCE_FRESH_LOGIN_DEFAULT: "${FORCE_FRESH_LOGIN_DEFAULT:-true}"
